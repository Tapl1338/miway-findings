# GitHub Pages deployment for the miway-findings showcase.
#
# Static Jekyll build (see _config.yml: README as index, relative links,
# optional front matter for the verbatim promoted findings). The configure
# step enables Pages on the repo if it is not enabled yet, so the first
# push to main bootstraps the site without a manual Settings toggle.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
        with:
          # First run on a fresh repo: create the Pages site (workflow
          # build type) via API, or deploy-pages fails with a 404.
          enablement: true
      - uses: actions/jekyll-build-pages@v1
        with:
          source: .
          destination: ./_site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
