<!-- Maskable variant: the glyph shrinks into the safe zone (inner 80%)
     and the background bleeds to the edges — Android fills the full
     canvas with it when masking into squircles/circles. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#1E1E1E"/>
  <path d="M128 352 C 192 352, 220 232, 288 200 S 384 168, 408 180"
        fill="none" stroke="#4FC3F7" stroke-width="24"
        stroke-linecap="round"/>
  <rect x="252" y="136" width="20" height="240" rx="10" fill="#EDEDED"/>
  <circle cx="262" cy="152" r="36" fill="#00E676"/>
  <circle cx="262" cy="152" r="16" fill="#121212"/>
</svg>
